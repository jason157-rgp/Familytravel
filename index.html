<!doctype html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭旅遊企劃書｜總覽</title>
<style>
:root{--ink:#22303c;--sub:#6b7c8c;--line:#e0e8ee;--bg:#f6fafb;--teal:#0f7f8c;--red:#a8452f;--gold:#c08a2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
header{padding:64px 20px 40px;text-align:center}
.kick{letter-spacing:.4em;font-size:13px;color:var(--sub);margin:0 0 14px}
h1{margin:0;font-size:34px;letter-spacing:.06em}
header p.sub{margin:12px 0 0;color:var(--sub);font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 72px}
.cards{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(34,48,60,.10)}
.tag{display:inline-block;font-size:12px;letter-spacing:.14em;padding:4px 11px;border-radius:999px;color:#fff}
.t-o{background:var(--teal)}
.t-s{background:var(--red)}
.card h2{margin:14px 0 8px;font-size:23px;letter-spacing:.04em}
.card .when{color:var(--ink);font-size:14.5px;margin:0}
.card .who{color:var(--sub);font-size:13px;margin:10px 0 0}
.go{margin:18px 0 0;font-size:14px;font-weight:600}
.c-o .go{color:var(--teal)}
.c-s .go{color:var(--red)}
.note{margin:34px 0 0;padding:16px 18px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;font-size:13.5px;color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:12.5px;padding:0 20px 48px}
</style>
</head>
<body>
<header>
<p class="kick">FAMILY TRAVEL</p>
<h1>家庭旅遊企劃書</h1>
<p class="sub">兩趟旅程·點進去看逐日行程、費用與待辦事項</p>
</header>
<div class="wrap">
<div class="cards">
<a class="card c-o" href="沖繩/index.html">
<span class="tag t-o">2026 秋 ・ 沖繩</span>
<h2>沖繩</h2>
<p class="when">2026/09/25（五）－09/28（一）　4 天 3 夜</p>
<p class="who">讀谷村 3 晚・虹夕諾雅 沖繩・自驕<br>機票・住宿・租車已訂妥付清</p>
<p class="go">看沖繩企劃書 →</p>
</a>
<a class="card c-s" href="仙台/index.html">
<span class="tag t-s">2026 秋 ・ 宮城</span>
<h2>仙台</h2>
<p class="when">2026/10/30（五）－11/05（四）　7 天 6 夜</p>
<p class="who">市區 4 晚 ＋ 秋保 2 晚<br>全案已定案</p>
<p class="go">看仙台企劃書 →</p>
</a>
</div>
<div class="note">訂位代號、票號、哩程帳號、護照與信用卡等識別資料一律不列於本網頁，均以「見私人記錄」標示。</div>
</div>
<footer>更新 2026/07/30</footer>
</body>
</html>
